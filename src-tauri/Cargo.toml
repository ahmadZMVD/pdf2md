[package]
name = "pdf2md"
version = "0.1.0"
description = "Offline PDF and document to Markdown converter shell"
authors = ["Ahmad Zamanvand"]
edition = "2021"

[lib]
name = "pdf2md_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2", features = ["tray-icon"] }

[profile.release]
codegen-units = 1
lto = true
panic = "abort"
strip = true
