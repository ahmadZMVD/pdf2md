<!doctype html>
<html lang="en" data-theme="light">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="light" />
    <meta
      name="description"
      content="An offline, lightweight PDF and document to Markdown converter."
    />
    <link rel="stylesheet" href="./styles/tailwind.css" />
    <title>PDF &amp; Document Converter</title>
  </head>
  <body class="app-shell">
    <main id="app" class="app-root">
      <!-- ===== Custom frameless titlebar ===== -->
      <header class="titlebar" data-tauri-drag-region>
        <div class="titlebar-drag" data-tauri-drag-region aria-hidden="true">
          <span class="titlebar-dot" aria-hidden="true"></span>
          <span class="titlebar-name" data-tauri-drag-region>PDF &amp; Document Converter</span>
        </div>
        <div class="window-controls" id="window-controls">
          <button id="win-minimize" class="window-control" type="button" aria-label="Minimize">
            <svg viewBox="0 0 12 12" width="10" height="10" fill="none" stroke="currentColor" stroke-width="1" stroke-linecap="round" aria-hidden="true"><path d="M2 6h8" /></svg>
          </button>
          <button id="win-maximize" class="window-control" type="button" aria-label="Maximize or restore">
            <svg class="icon-maximize" viewBox="0 0 12 12" width="10" height="10" fill="none" stroke="currentColor" stroke-width="1" aria-hidden="true"><rect x="2.5" y="2.5" width="7" height="7" rx="1" /></svg>
            <svg class="icon-restore" viewBox="0 0 12 12" width="10" height="10" fill="none" stroke="currentColor" stroke-width="1" aria-hidden="true"><path d="M4 4V2.5h5.5V8H8M4 4H2.5v5.5H8V8" /></svg>
          </button>
          <button id="win-close" class="window-control is-close" type="button" aria-label="Close to tray">
            <svg viewBox="0 0 12 12" width="10" height="10" fill="none" stroke="currentColor" stroke-width="1.1" stroke-linecap="round" aria-hidden="true"><path d="M2.5 2.5l7 7M9.5 2.5l-7 7" /></svg>
          </button>
        </div>
      </header>

      <!-- ===== Top : Options bar ===== -->
      <header class="top-bar" aria-label="Conversion options">
        <div class="brand-row">
          <div class="brand-block">
            <p class="eyebrow">Offline converter</p>
            <h1 class="brand-title">PDF &amp; Document</h1>
          </div>
          <div class="brand-actions">
            <span id="batch-badge" class="batch-badge" data-state="idle">Ready</span>
            <button id="settings-btn" class="icon-button" type="button" aria-label="Open settings" aria-haspopup="dialog">
              <svg viewBox="0 0 20 20" fill="none" width="16" height="16" aria-hidden="true">
                <path
                  d="M10 6.5a3.5 3.5 0 1 0 0 7 3.5 3.5 0 0 0 0-7ZM17.3 11.2l-1.8-.3a6.6 6.6 0 0 0-.5-1.2l1.1-1.5-1.9-1.9-1.5 1.1a6.6 6.6 0 0 0-1.2-.5l-.3-1.8h-2.6l-.3 1.8a6.6 6.6 0 0 0-1.2.5L5.6 5.3 3.7 7.2l1.1 1.5a6.6 6.6 0 0 0-.5 1.2l-1.8.3v2.6l1.8.3c.1.4.3.8.5 1.2l-1.1 1.5 1.9 1.9 1.5-1.1c.4.2.8.4 1.2.5l.3 1.8h2.6l.3-1.8a6.6 6.6 0 0 0 1.2-.5l1.5 1.1 1.9-1.9-1.1-1.5c.2-.4.4-.8.5-1.2l1.8-.3v-2.6Z"
                  fill="currentColor"
                />
                <circle cx="10" cy="10" r="2.1" fill="#F5F5F7" />
              </svg>
            </button>
          </div>
        </div>

        <div class="options-grid">
          <div class="field field-wide">
            <span class="field-label">Format</span>
            <div id="format-seg" class="seg" role="radiogroup" aria-label="Output format">
              <button type="button" role="radio" aria-checked="true" class="seg-option is-active" data-value="md">Markdown (.md)</button>
              <button type="button" role="radio" aria-checked="false" class="seg-option" data-value="txt">Plain Text (.txt)</button>
              <span class="seg-thumb" aria-hidden="true"></span>
            </div>
          </div>

          <div class="field">
            <span class="field-label">Destination</span>
            <div id="destination-seg" class="seg" role="radiogroup" aria-label="Output destination">
              <button type="button" role="radio" aria-checked="true" class="seg-option is-active" data-value="auto">Beside source</button>
              <button type="button" role="radio" aria-checked="false" class="seg-option" data-value="custom">Custom folder</button>
              <span class="seg-thumb" aria-hidden="true"></span>
            </div>
          </div>

          <div class="field">
            <span class="field-label">PDF images</span>
            <div id="images-seg" class="seg" role="radiogroup" aria-label="PDF image extraction">
              <button type="button" role="radio" aria-checked="true" class="seg-option is-active" data-value="auto">Auto (extract)</button>
              <button type="button" role="radio" aria-checked="false" class="seg-option" data-value="disabled">Disabled</button>
              <span class="seg-thumb" aria-hidden="true"></span>
            </div>
          </div>
        </div>
      </header>

      <div class="top-divider" aria-hidden="true"></div>

      <!-- ===== Bottom : Dropzone & Queue (dynamic collapse) ===== -->
      <section class="work-area" aria-live="polite">
        <div id="dropzone" class="dropzone" role="button" tabindex="0" aria-label="Drop or browse files">
          <div class="dropzone-glyph" aria-hidden="true">
            <svg viewBox="0 0 24 24" fill="none" width="22" height="22">
              <path
                d="M12 16V4m0 0L7.5 8.5M12 4l4.5 4.5M5 15v3a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2v-3"
                stroke="currentColor"
                stroke-width="1.6"
                stroke-linecap="round"
                stroke-linejoin="round"
              />
            </svg>
          </div>
          <div class="dropzone-copy">
            <p class="dropzone-title">Drag &amp; drop files here</p>
            <p class="dropzone-sub">PDF, DOCX or TXT · converted locally</p>
          </div>
          <button id="browse-btn" class="ghost-button" type="button">Browse Files</button>
        </div>

        <div id="queue-panel" class="queue-panel" hidden>
          <div class="queue-header">
            <span id="queue-count" class="queue-count">0 files</span>
            <label class="apply-all" title="Apply extract-images to every PDF in the list">
              <input id="apply-all-input" type="checkbox" />
              <span>Extract images for all</span>
            </label>
          </div>
          <ul id="queue-list" class="queue-list"></ul>
        </div>
      </section>

      <!-- ===== Bottom action bar ===== -->
      <footer class="action-bar">
        <button id="clear-btn" class="secondary-button" type="button">Clear List</button>
        <button id="convert-btn" class="primary-button" type="button">Convert All</button>
      </footer>
    </main>

    <!-- ===== Settings modal ===== -->
    <div id="settings-overlay" class="settings-overlay" hidden>
      <div class="settings-backdrop" data-close-settings aria-hidden="true"></div>
      <section class="settings-panel" role="dialog" aria-modal="true" aria-labelledby="settings-title">
        <header class="settings-header">
          <h2 id="settings-title" class="settings-title">Settings</h2>
          <button id="settings-close" class="icon-button" type="button" aria-label="Close settings">
            <svg viewBox="0 0 12 12" width="11" height="11" fill="none" stroke="currentColor" stroke-width="1.1" stroke-linecap="round" aria-hidden="true"><path d="M2.5 2.5l7 7M9.5 2.5l-7 7" /></svg>
          </button>
        </header>

        <div class="settings-body">
          <label class="field">
            <span class="field-label">Global default output folder</span>
            <span class="folder-row">
              <input id="folder-input" class="folder-input" type="text" spellcheck="false" placeholder="Auto — beside each source file" />
              <button id="browse-folder-btn" class="folder-browse" type="button">Browse…</button>
            </span>
          </label>
          <p class="settings-hint">Used when Destination is set to “Custom folder”.</p>
        </div>

        <footer class="settings-footer">
          <button id="settings-save" class="primary-button settings-save" type="button">Save Settings</button>
        </footer>
      </section>
    </div>

    <!-- ===== Completion toast ===== -->
    <div id="completion-toast" class="completion-toast" aria-hidden="true">
      <span class="completion-mark">✓</span>
      <span id="completion-text">Batch complete</span>
    </div>

    <input id="file-input" type="file" multiple accept=".pdf,.docx,.txt" hidden />

    <script type="module" src="./main.js"></script>
  </body>
</html>
