name: Windows desktop build

"on":
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-windows:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Install frontend dependencies
        run: npm ci

      - name: Run native Rust tests
        run: cargo test --manifest-path src-tauri/Cargo.toml --lib

      - name: Build Tauri Windows installer
        run: npm run tauri build

      - name: Verify executable output
        shell: pwsh
        run: |
          $executables = @(Get-ChildItem -Path "src-tauri\target\release\bundle" -Filter "*.exe" -Recurse -File)
          if ($executables.Count -eq 0) {
            throw "Tauri did not produce a Windows executable."
          }
          foreach ($executable in $executables) {
            $sizeMb = [math]::Round($executable.Length / 1MB, 2)
            Add-Content -Path $env:GITHUB_STEP_SUMMARY -Value ("- `{0}`: {1} MB" -f $executable.FullName, $sizeMb)
          }

      - name: Upload Windows executable
        uses: actions/upload-artifact@v4
        with:
          name: PDF-Converter-Windows-EXE
          path: src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: error
          retention-days: 14
