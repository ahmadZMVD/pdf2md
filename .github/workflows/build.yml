name: Windows desktop build

"on":
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Python test dependency
        run: python -m pip install --disable-pip-version-check pyyaml

      - name: Install frontend dependencies
        run: npm ci

      - name: Validate semantic commit subjects
        env:
          PR_TITLE: ${{ github.event.pull_request.title || '' }}
          CI_BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before || '' }}
          CI_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: python scripts/validate_commit.py --ci

      - name: Run local-equivalent Python/schema tests
        run: python -m unittest discover -s tests -p "test_*.py" -v

      - name: Run frontend adapter tests
        run: npm run test:frontend

      - name: Build frontend
        run: npm run build

  build-windows:
    needs: quality
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Generate deterministic Cargo.lock
        run: cargo generate-lockfile --manifest-path src-tauri/Cargo.toml

      - name: Cache Rust dependencies and build output
        id: rust-cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target
          shared-key: tauri-v2-windows-release
          cache-on-failure: true

      - name: Report Rust cache result
        shell: pwsh
        run: |
          Add-Content -Path $env:GITHUB_STEP_SUMMARY -Value ("- Rust cache hit: `{0}`" -f "${{ steps.rust-cache.outputs.cache-hit }}")

      - name: Install frontend dependencies
        run: npm ci

      - name: Run native Rust tests
        run: cargo test --manifest-path src-tauri/Cargo.toml --lib --release

      - name: Build Tauri Windows installer
        run: npm run tauri build

      - name: Verify executable output
        shell: pwsh
        run: |
          $executables = @(Get-ChildItem -Path "src-tauri\target\release\bundle" -Filter "*.exe" -Recurse -File)
          if ($executables.Count -eq 0) {
            throw "Tauri did not produce a Windows executable."
          }
          foreach ($executable in $executables) {
            $sizeMb = [math]::Round($executable.Length / 1MB, 2)
            Add-Content -Path $env:GITHUB_STEP_SUMMARY -Value ("- `{0}`: {1} MB" -f $executable.FullName, $sizeMb)
          }

      - name: Upload Windows executable
        uses: actions/upload-artifact@v4
        with:
          name: PDF-Converter-Windows-EXE
          path: src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: error
          retention-days: 14

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build-windows
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download verified Windows executable
        uses: actions/download-artifact@v4
        with:
          name: PDF-Converter-Windows-EXE
          path: release-artifact

      - name: Create GitHub release for version tag
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: release-artifact/*.exe
